name=EMC_RFTest
version=1.0.0
author=Espressif Systems
maintainer=discovery-drive
sentence=Precompiled Espressif RF certification test library (librftest.a) for EMC compliance testing.
paragraph=Provides esp_phy_rftest_init, esp_phy_wifi_tx_tone and related RF test functions used by the discovery-drive EMC test mode to emit a CW carrier. The .a blob is taken from espressif/esp-phy-lib commit cb9f62b42096ec1e20c05f2aa57fdd0d04df4d33, which byte-for-byte matches the libphy.a shipped with arduino-esp32 core 3.3.5 (IDF v5.5). If the arduino-esp32 core is updated, re-fetch librftest.a from the esp_phy submodule commit of the matching ESP-IDF revision.
category=Communication
url=https://github.com/espressif/esp-phy-lib
architectures=esp32
precompiled=true
